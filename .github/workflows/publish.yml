name: Publish

# Run from the Actions tab: bump and tag a release, or publish the current version with none.
# Publishing authenticates with npm trusted publishing (OIDC), so no npm token is stored in the repo
on:
  workflow_dispatch:
    inputs:
      release:
        description: Version bump (none publishes the current version)
        type: choice
        options:
          - patch
          - minor
          - major
          - none
        default: patch

permissions:
  # Push the version commit and tag
  contents: write
  # Exchange the workflow's OIDC token for a short-lived npm publish credential
  id-token: write

# Never publish two releases at once
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    # Only release from main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Release notes need the previous tag and its commit history.
          fetch-depth: 0

      # Reads the pnpm version from package.json's packageManager field
      - uses: pnpm/action-setup@v6

      # Trusted publishing needs npm 11.5.1 or newer, which ships with Node 24
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Bump version
        if: inputs.release != 'none'
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "$RELEASE" -m "v%s"

      # prepublishOnly builds the package first. Trusted publishing attaches provenance automatically
      - run: npm publish --access public

      # Push only after a successful publish, so a failed publish leaves no stray tag
      - run: git push --follow-tags
        if: inputs.release != 'none'

      # Include only feat/fix conventional commits since the previous release.
      - name: Create GitHub release
        if: inputs.release != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          node scripts/release-notes.mjs "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$VERSION" --title "$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag
